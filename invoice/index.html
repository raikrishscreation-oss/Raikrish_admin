<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b3d29">
<title>Invoice – RaiKrish's Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --green:#0b3d29; --green2:#145a3d; --gold:#c9a24b; --cream:#fbf7ef; --ink:#1f2a24; --muted:#6b7a72; --line:#e6dfcf;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:#efe9db;color:var(--ink);font-size:14px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0}
.topbar{background:linear-gradient(90deg,var(--green),var(--green2));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--gold)}
.topbar img{width:40px;height:40px;border-radius:50%;background:#fff;object-fit:cover}
.topbar h1{font-size:19px;font-weight:600}
.topbar small{opacity:.75;display:block;font-family:'Poppins';font-size:11px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(11,61,41,.05)}
.card h2{font-size:18px;color:var(--green);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
label b{color:#c0392b}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #d6cfbd;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
textarea{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font:500 14px 'Poppins';cursor:pointer;background:var(--green);color:#fff;transition:.15s}
.btn:hover{background:var(--green2)}
.btn.gold{background:var(--gold);color:#2b2105}
.btn.gold:hover{background:#b8913e}
.btn.light{background:#fff;color:var(--green);border:1px solid var(--green)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.red{background:#fff;color:#c0392b;border:1px solid #e3b4ae}
.btn:disabled{opacity:.6;cursor:wait}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.status{font-size:12px;color:var(--muted);margin-top:8px}
.status.ok{color:#1b7a4b}.status.err{color:#c0392b}

.items-head,.item-row{display:grid;grid-template-columns:minmax(0,3fr) 80px 100px 100px 110px 40px;gap:8px;align-items:center}
.items-head{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px;padding:0 2px}
.item-row{margin-bottom:8px;padding:8px;border:1px dashed var(--line);border-radius:10px;background:var(--cream)}
.item-row .amt{font-weight:600;text-align:right;padding-right:6px}
.item-row .mini{font-size:11px;color:var(--muted);margin-top:3px;min-height:14px}
.rm{width:34px;height:34px;padding:0;justify-content:center}
.totals{display:flex;justify-content:flex-end;margin-top:12px}
.totals table{min-width:280px}
.totals td{padding:4px 0}
.totals td:last-child{text-align:right;font-weight:600}
.totals .gt td{font-size:17px;color:var(--green);border-top:2px solid var(--green);padding-top:8px}
.admin-note{font-size:12px;color:var(--muted);margin-top:8px;text-align:right}

.preview-wrap{overflow:hidden;position:relative;background:#d9d2c0;border-radius:10px}
#sheetHost{transform-origin:top left;width:794px}

.sheet .band,.sheet .body,.sheet .foot{position:relative;z-index:1}
.sheet .stripe{height:8px;background:linear-gradient(90deg,var(--gold),#e8d08a,var(--gold));position:relative;z-index:1}
.sheet .band{background:none;color:#5b6b62;padding:66px 76px 14px;display:flex;align-items:center;gap:16px}
.sheet .band img{width:74px;height:74px;border-radius:50%;background:#fff;object-fit:cover;border:3px solid var(--gold)}
.sheet .band .brand h2{font-size:26px;color:var(--green);letter-spacing:.4px}
.sheet .band .brand p{margin:4px 0 0;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#a07f2c}
.sheet .band .tag{margin-left:auto;text-align:right}
.sheet .band .tag h3{font-size:30px;color:var(--gold);letter-spacing:5px;font-weight:700}
.sheet .band .tag span{display:block;font-size:11px;opacity:.85;margin-top:2px}
.sheet .goldline{height:3px;margin:0 76px;background:var(--gold);position:relative;z-index:1}
.sheet .body{padding:22px 76px 10px;flex:1}
.sheet .meta{display:flex;justify-content:space-between;gap:18px;margin-bottom:22px}
.sheet .box{flex:1;background:rgba(251,247,239,.85);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:12px 15px}
.sheet .box h4{margin:0 0 7px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#a07f2c;font-weight:600}
.sheet .box p{margin:3px 0;line-height:1.5}
.sheet .box .nm{font-weight:600;font-size:16px;color:var(--green)}
.sheet .box i{color:var(--gold);width:18px}
.sheet table.it{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:18px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sheet table.it th{background:var(--green);color:#fff;text-align:left;padding:10px;font-size:11.5px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.sheet table.it th.r,.sheet table.it td.r{text-align:right}
.sheet table.it td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;background:rgba(255,255,255,.55)}
.sheet table.it tbody tr:nth-child(even) td{background:rgba(251,247,239,.8)}
.sheet table.it tr{page-break-inside:avoid;break-inside:avoid}
.sheet table.it td small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
.sheet .sum{display:flex;justify-content:flex-end}
.sheet .sum table{min-width:280px;border-collapse:collapse;border-radius:8px;overflow:hidden}
.sheet .sum td{padding:7px 12px;background:rgba(251,247,239,.85)}
.sheet .sum td:last-child{text-align:right;font-weight:500}
.sheet .sum tr.gt td{background:var(--green);color:#fff;font-weight:600;font-size:16px;padding:10px 12px}
.sheet .sum tr.gt td:last-child{color:#f0d588}
.sheet .sum tr.dc td{color:#b3261e;font-weight:600}
.sheet .sum tr.sv td{background:none;text-align:right;font-size:11.5px;color:#0b6b3f;font-weight:600;padding:6px 2px 0}
.sheet .foot{margin:auto 76px 0;padding:14px 24px 84px;border-top:3px solid var(--gold);background:none;display:flex;gap:24px;align-items:center;page-break-inside:avoid;break-inside:avoid}
.sheet .qr{width:150px;text-align:center;flex:none}
.sheet .qr .q{width:150px;height:150px;border:2px solid var(--gold);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}
.sheet .qr .q img{width:100%;height:100%;object-fit:contain}
.sheet .qr b{display:block;margin-top:7px;font-size:13px;color:var(--green);letter-spacing:.6px}
.sheet .contact{flex:1;line-height:1.85}
.sheet .contact .thx{font-family:'Playfair Display',serif;font-size:20px;color:var(--green);margin-bottom:5px}
.sheet .contact i{display:inline-block;width:26px;margin-right:6px;text-align:center;color:var(--gold)}
.sheet .contact .small{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:7px;border-top:1px dashed #d8cdb0;padding-top:6px}

.sheet .contact .ph{white-space:nowrap}
.sheet .contact .ph span{display:inline-block;margin-right:30px}
.sheet .contact .ph span:last-child{margin-right:0}
.sheet .contact i.fa-whatsapp{color:#25D366}

/* customer suggestions */
.sugwrap{position:relative}
.sug{display:none;position:absolute;left:0;right:0;top:100%;margin-top:3px;background:#fff;border:1px solid var(--gold);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.18);z-index:60;max-height:260px;overflow-y:auto}
.sug .si{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.sug .si:last-child{border-bottom:0}
.sug .si:hover,.sug .si.on{background:var(--cream)}
.sug .si b{font-weight:600;color:var(--green);font-size:13px}
.sug .si span{color:var(--muted);font-size:12px;white-space:nowrap}
.sug .si small{display:block;color:var(--muted);font-size:11px;font-weight:400}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,420px);background:var(--green);color:#fff;border:1px solid var(--gold);padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:1000;text-align:center;word-break:break-word}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .items-head{display:none}
  .item-row{grid-template-columns:1fr 1fr}
  .item-row>div:first-child{grid-column:1/-1}
  .item-row .amt{text-align:left}
}

@page{size:A4;margin:0}
@media print{
  html,body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none!important}
  .wrap{padding:0;max-width:none}
  .card.pv{border:0;box-shadow:none;padding:0;margin:0;background:none}
  .preview-wrap{height:auto!important;background:none;overflow:visible}
  #sheetHost{transform:none!important;width:210mm}
  .sheet{width:210mm;min-height:296mm}
}
</style>
</head>
<body>

<div class="topbar no-print">
  <img id="topLogo" alt="logo">
  <div><h1>RaiKrish's Collection</h1><small>Invoice Generator</small></div>
</div>

<div class="wrap">

  <div class="card no-print">
    <h2><i class="fa-solid fa-user"></i> Customer details</h2>
    <div class="grid">
      <div class="sugwrap"><label>Customer name <b>*</b></label><input id="cName" placeholder="Type name to search saved customers" autocomplete="off"><div class="sug" id="sugName"></div></div>
      <div class="sugwrap"><label>Phone no <b>*</b></label><input id="cPhone" inputmode="tel" placeholder="Mobile number" autocomplete="off"><div class="sug" id="sugPhone"></div></div>
      <div><label>Email</label><input id="cEmail" type="email" placeholder="Optional"></div>
      <div><label>Invoice no (auto)</label>
        <div style="display:flex;gap:6px;align-items:center">
          <span id="invPrefix" style="font-weight:600;color:var(--green)">RKC26</span>
          <input id="serial" type="number" min="1" style="width:90px" title="Serial number">
        </div>
      </div>
      <div><label>Order ID</label><input id="orderId" type="text" placeholder="Optional"></div>
    </div>
    <div style="margin-top:12px"><label>Customer address</label><textarea id="cAddr" placeholder="Address, city, state, pincode"></textarea></div>
  </div>

  <div class="card no-print">
    <h2><i class="fa-solid fa-basket-shopping"></i> Items</h2>
    <div class="items-head"><div>Product ID / Name</div><div>Qty</div><div>Selling price</div><div>Cost</div><div style="text-align:right">Amount</div><div></div></div>
    <div id="rows"></div>
    <div class="actions" style="margin-top:6px">
      <button class="btn light" id="addItem"><i class="fa-solid fa-plus"></i> Add item</button>
    </div>
    <div class="grid" style="margin-top:16px;max-width:600px">
      <div><label>Delivery charge (₹)</label><input id="delivery" type="number" min="0" inputmode="numeric" placeholder="0"></div>
      <div><label>Discount (%)</label><input id="discount" type="number" min="0" max="100" step="any" inputmode="decimal" placeholder="0"></div>
    </div>
    <div class="totals"><table>
      <tr><td>Subtotal</td><td id="tSub">₹0</td></tr>
      <tr id="tDiscRow" style="display:none"><td>Discount (<span id="tDiscPct">0</span>%)</td><td id="tDisc">-₹0</td></tr>
      <tr><td>Delivery charge</td><td id="tDel">₹0</td></tr>
      <tr class="gt"><td>Total</td><td id="tGrand">₹0</td></tr>
    </table></div>
    <div class="admin-note">Only you see this: cost ₹<span id="tCost">0</span> · profit ₹<span id="tProfit">0</span></div>
  </div>

  <div class="card no-print">
    <div class="actions">
      <button class="btn" id="btnPdf"><i class="fa-solid fa-file-pdf"></i> PDF</button>
      <button class="btn gold" id="btnPrint"><i class="fa-solid fa-print"></i> Print</button>
      <button class="btn light" id="btnSave"><i class="fa-solid fa-cloud-arrow-up"></i> Save to sheet</button>
      <button class="btn light" id="btnSync"><i class="fa-solid fa-rotate"></i> Sync</button>
      <button class="btn red" id="btnNew"><i class="fa-solid fa-file-circle-plus"></i> New invoice</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card pv">
    <h2 class="no-print"><i class="fa-solid fa-eye"></i> Invoice preview</h2>
    <div class="preview-wrap" id="pvWrap"><div id="sheetHost"></div></div>
  </div>

  <datalist id="plist"></datalist>
  <div id="toast" class="toast no-print" role="status" aria-live="polite"></div>

  <div class="card no-print">
    <h2><i class="fa-solid fa-list"></i> Product list <span id="pcount" style="font-size:13px;color:var(--muted);font-family:Poppins"></span></h2>
    <input id="psearch" placeholder="Search by ID, name or description…" style="max-width:360px;margin-bottom:10px">
    <div style="overflow-x:auto;max-height:420px;overflow-y:auto">
      <table style="width:100%;border-collapse:collapse;min-width:520px">

  if (url.startsWith('data:')) return Promise.resolve(url);
  return fetch(url).then(r => { if (!r.ok) throw 0; return r.blob(); })
    .then(b => new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); }));
}
if (LOGO_URL) $('topLogo').src = LOGO_URL; else $('topLogo').style.display = 'none';
if (QR_URL) toDataURL(QR_URL).then(d => { qrSrc = d; renderDoc(); }).catch(e => { console.error('QR load fail:', e); qrSrc = QR_URL; renderDoc(); });

/* ================= INVOICE NUMBER ================= */
const yy = () => String(invDate.getFullYear()).slice(-2);
const lastLocal = () => parseInt(lsGet('rkc_serial_' + yy(), '0'), 10) || 0;
function invNo() { const s = parseInt($('serial').value, 10) || 1; return 'RKC' + yy() + String(s).padStart(3, '0'); }
async function refreshSerial() {
  $('invPrefix').textContent = 'RKC' + yy();
  let next = lastLocal() + 1, fromServer = false;
  if (API_URL) {
    try {
      const r = await (await fetch(`${API_URL}?action=nextserial&yy=${yy()}&_=${Date.now()}`)).json();
      // sheet is the truth: use its number exactly (local memory is only a fallback)
      if (r && r.ok && Number.isInteger(r.nextSerial) && r.nextSerial > 0) { next = r.nextSerial; fromServer = true; }
    } catch (e) {}
    if (!fromServer) toast('Invoice no: could not read sheet. Redeploy Apps Script as NEW version.');
  }
  $('serial').value = next; renderDoc();
}
function markUsed() { const s = parseInt($('serial').value, 10) || 1; if (s > lastLocal()) lsSet('rkc_serial_' + yy(), String(s)); }

/* ================= CUSTOMERS (suggestions from CRM sheet) ================= */
let customers = [];
try { customers = JSON.parse(lsGet('rkc_customers', '[]')); } catch (e) { customers = []; }
const digitsOf = v => String(v || '').replace(/\D/g, '');
async function loadCustomers() {
  if (!API_URL) return;
  try {
    const r = await (await fetch(`${API_URL}?action=customers&_=${Date.now()}`)).json();
    if (r && r.ok && Array.isArray(r.customers)) { customers = r.customers; lsSet('rkc_customers', JSON.stringify(customers)); }
  } catch (e) {}
}
function showSug(box, q) {
  q = q.trim();
  const ql = q.toLowerCase(), qd = digitsOf(q);
  if (!q) { box.style.display = 'none'; return; }
  const list = customers.filter(c =>
    String(c.name || '').toLowerCase().includes(ql) || (qd && digitsOf(c.phone).includes(qd))
  ).sort((a, b) => {
    const as = String(a.name || '').toLowerCase().startsWith(ql) || digitsOf(a.phone).startsWith(qd) ? 0 : 1;
    const bs = String(b.name || '').toLowerCase().startsWith(ql) || digitsOf(b.phone).startsWith(qd) ? 0 : 1;
    return as - bs;
  }).slice(0, 6);
  box._list = list;
  if (!list.length) { box.style.display = 'none'; return; }
  box.innerHTML = list.map((c, i) => `<div class="si" data-i="${i}"><div><b>${esc(c.name || '—')}</b>${c.address ? `<small>${esc(String(c.address).slice(0, 40))}</small>` : ''}</div><span>${esc(c.phone || '')}</span></div>`).join('');
  box.style.display = 'block';
}
function pickCustomer(c) {
  $('cName').value = c.name || ''; $('cPhone').value = c.phone || '';
  $('cEmail').value = c.email || ''; $('cAddr').value = c.address || '';
  ['sugName', 'sugPhone'].forEach(id => $(id).style.display = 'none');
  renderDoc(); toast('Customer filled: ' + (c.name || c.phone));
}
[['cName', 'sugName'], ['cPhone', 'sugPhone']].forEach(([inp, sug]) => {
  const input = $(inp), box = $(sug);
  input.addEventListener('input', () => showSug(box, input.value));
  input.addEventListener('focus', () => { if (input.value.trim()) showSug(box, input.value); });
  input.addEventListener('keydown', e => { if (e.key === 'Escape') box.style.display = 'none'; });
  box.addEventListener('pointerdown', e => {
    const el = e.target.closest('.si'); if (!el) return;
    e.preventDefault();
    const c = box._list && box._list[+el.dataset.i]; if (c) pickCustomer(c);
  });
});
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('.sugwrap')) ['sugName', 'sugPhone'].forEach(id => $(id).style.display = 'none');
});

/* ================= PRODUCTS ================= */
function parseGviz(text) {
  const m = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if (!m) throw new Error('Sheet is not shared publicly');
  const j = JSON.parse(m[1]);
  const cols = j.table.cols.map(c => (c.label || '').toLowerCase().replace(/[^a-z]/g, ''));
  const out = [];
  j.table.rows.forEach(r => {
    const o = {}; cols.forEach((c, i) => { const cell = r.c[i]; o[c] = cell ? (cell.v ?? cell.f ?? '') : ''; });
    const id = String(o.productid ?? '').trim(); if (!id) return;
    out.push({ id, type: String(o.type ?? '').trim(), desc: String(o.description ?? '').trim(), img: String(o.imagename ?? '').trim(), sell: num(o.sellingprice) || num(o.price), cost: num(o.cost) });
  });
  return out;
}
async function syncProducts() {
  say('Syncing products…');
  try {
    if (API_URL) {
      const r = await (await fetch(`${API_URL}?action=products&_=${Date.now()}`)).json();
      if (!r.ok) throw new Error(r.error || 'API error');
      products = r.products;
    } else {
      const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      products = parseGviz(await res.text());
    }
    lsSet('rkc_products', JSON.stringify(products));
    say(`Synced ${products.length} products · ${new Date().toLocaleTimeString()}`, 'ok');
  } catch (e) {
    try { products = JSON.parse(lsGet('rkc_products', '[]')); } catch (x) { products = []; }
    say(`Sync failed (${e.message}). Using ${products.length} saved products.`, 'err');
  }
  buildLists();
}
const keyOf = p => `${p.id} | ${p.type}`;
function buildLists() {
  $('plist').innerHTML = products.map(p => `<option value="${esc(keyOf(p))}">${esc(p.desc)} – ${inr(p.sell)}</option>`).join('');
  $('pcount').textContent = `(${products.length})`;
  renderProductTable();
}
function renderProductTable() {
  const q = $('psearch').value.trim().toLowerCase();
  const list = products.filter(p => !q || (p.id + ' ' + p.type + ' ' + p.desc).toLowerCase().includes(q));
  $('pbody').innerHTML = list.map(p => `
    <tr style="border-bottom:1px solid var(--line)">
      <td style="padding:7px 8px;font-weight:600">${esc(p.id)}</td>
      <td style="padding:7px 8px">${esc(p.type)}${p.desc ? `<div style="font-size:11px;color:var(--muted)">${esc(p.desc.slice(0, 70))}</div>` : ''}</td>
      <td style="padding:7px 8px;text-align:right">${inr(p.sell)}</td>
      <td style="padding:7px 8px;text-align:right">${inr(p.cost)}</td>
      <td style="padding:7px 8px;text-align:right"><button class="btn sm light" data-add="${esc(p.id)}"><i class="fa-solid fa-plus"></i> Add</button></td>
    </tr>`).join('') || '<tr><td colspan="5" style="padding:14px;color:var(--muted)">No products</td></tr>';
}
function findProduct(val) {
  val = String(val || '').trim().toLowerCase(); if (!val) return null;
  return products.find(p => keyOf(p).toLowerCase() === val) || products.find(p => p.id.toLowerCase() === val) || products.find(p => p.type.toLowerCase() === val) || null;
}

/* ================= ITEMS ================= */
function addItem(p) {
  if (p) toast(`${p.type || p.id} added × 1`);
  items.push(p ? { pid: p.id, name: p.type || p.id, desc: p.desc, qty: 1, rate: p.sell, cost: p.cost, text: keyOf(p) } : blank());
  renderRows(); renderDoc();
}
function renderRows() {
  $('rows').innerHTML = items.map((it, i) => `
    <div class="item-row" data-i="${i}">
      <div><input list="plist" class="f-item" placeholder="Type product ID or name" value="${esc(it.text)}">
        <div class="mini">${it.pid ? 'Cost auto-filled (editable)' : ''}</div></div>
      <div><input type="number" min="1" class="f-qty" value="${it.qty}" inputmode="numeric"></div>
      <div><input type="number" min="0" class="f-rate" value="${it.rate}" inputmode="numeric"></div>
      <div><input type="number" min="0" class="f-cost" value="${it.cost}" inputmode="numeric" title="Cost price (editable)"></div>
      <div class="amt">${inr(it.qty * it.rate)}</div>
      <div><button class="btn red rm" data-rm="${i}" title="Remove"><i class="fa-solid fa-trash"></i></button></div>
    </div>`).join('');
}
function fillItem(it, p, row) {
  const isNew = it.pid !== p.id;
  it.pid = p.id; it.name = p.type || p.id; it.desc = p.desc; it.rate = p.sell; it.cost = p.cost; it.text = keyOf(p);
  row.querySelector('.f-rate').value = p.sell; row.querySelector('.f-cost').value = p.cost;
  row.querySelector('.mini').textContent = 'Cost auto-filled (editable)';
  if (isNew) toast(`${it.name} added × ${it.qty}`);
}
$('rows').addEventListener('input', e => {
  const row = e.target.closest('.item-row'); if (!row) return;
  const it = items[+row.dataset.i];
  if (e.target.classList.contains('f-item')) {
    it.text = e.target.value;
    const p = products.find(p => keyOf(p).toLowerCase() === it.text.trim().toLowerCase());
    if (p) fillItem(it, p, row); else { it.pid = ''; it.name = it.text; it.desc = ''; }
  } else if (e.target.classList.contains('f-qty')) it.qty = Math.max(0, num(e.target.value));
  else if (e.target.classList.contains('f-rate')) it.rate = Math.max(0, num(e.target.value));
  else if (e.target.classList.contains('f-cost')) it.cost = Math.max(0, num(e.target.value));
  row.querySelector('.amt').textContent = inr(it.qty * it.rate);
  renderDoc();
});
$('rows').addEventListener('change', e => {
  if (!e.target.classList.contains('f-item')) return;
  const row = e.target.closest('.item-row'), it = items[+row.dataset.i], p = findProduct(e.target.value);
  if (p) { fillItem(it, p, row); e.target.value = it.text; row.querySelector('.amt').textContent = inr(it.qty * it.rate); renderDoc(); }
});
$('rows').addEventListener('click', e => {
  const b = e.target.closest('[data-rm]'); if (!b) return;
  items.splice(+b.dataset.rm, 1); if (!items.length) items.push(blank());
  renderRows(); renderDoc();
});
$('addItem').onclick = () => addItem();
$('pbody').addEventListener('click', e => {
  const b = e.target.closest('[data-add]'); if (!b) return;
  const p = products.find(x => x.id === b.dataset.add); if (!p) return;
  const empty = items.findIndex(i => !i.text && !i.rate); if (empty >= 0) items.splice(empty, 1);
  addItem(p); say(`Added ${p.id} to invoice`, 'ok');
});
$('psearch').addEventListener('input', renderProductTable);

/* ================= DOCUMENT ================= */
function totals() {
  const sub = items.reduce((s, i) => s + i.qty * i.rate, 0);
  const del = Math.max(0, num($('delivery').value));
  const cost = items.reduce((s, i) => s + i.qty * i.cost, 0);
  const pct = Math.min(100, Math.max(0, num($('discount').value)));
  const disc = Math.round(sub * pct) / 100;
  return { sub, del, pct, disc, grand: sub - disc + del, cost, profit: sub - disc - cost };
}
const fmtDate = d => d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
const validItems = () => items.filter(i => (i.text || i.name) && i.qty > 0);

function docHTML() {
  const t = totals();
  const rows = validItems().map((i, n) => `
    <tr><td>${n + 1}</td>
      <td><b>${esc(i.pid ? i.name : i.text)}</b>${i.pid ? `<small>${esc(i.pid)}${i.desc ? ' · ' + esc(i.desc.slice(0, 90)) : ''}</small>` : ''}</td>
      <td class="r">${i.qty}</td><td class="r">${inr(i.rate)}</td><td class="r">${inr(i.qty * i.rate)}</td></tr>`).join('')
    || `<tr><td colspan="5" style="text-align:center;color:#999;padding:24px">No items added</td></tr>`;
  const addr = esc($('cAddr').value).replace(/\n/g, '<br>');
  return `
  <div class="sheet">
    <div class="band">
      ${logoSrc ? `<img src="${esc(logoSrc)}" crossorigin="anonymous" alt="">` : ''}
      <div class="brand"><h2>RaiKrish's Collection</h2><p>Where Creativity Meets Craft</p></div>
      <div class="tag"><h3>INVOICE</h3><span>${invNo()}</span>${$('orderId').value.trim() ? `<span>Order ID: ${esc($('orderId').value.trim())}</span>` : ''}</div>
    </div>
    <div class="goldline"></div>
    <div class="body">
      <div class="meta">
        <div class="box"><h4>Billed to</h4>
          <p class="nm">${esc($('cName').value) || '—'}</p>
          <p><i class="fa-solid fa-phone"></i>${esc($('cPhone').value) || '—'}</p>
          ${$('cEmail').value ? `<p><i class="fa-solid fa-envelope"></i>${esc($('cEmail').value)}</p>` : ''}
          ${addr ? `<p><i class="fa-solid fa-location-dot"></i>${addr}</p>` : ''}
        </div>
        <div class="box" style="flex:0 0 245px"><h4>Invoice details</h4>
          <p><span style="color:#6b7a72">Invoice no</span><br><b style="font-size:15px;color:#0b3d29">${invNo()}</b></p>
          ${$('orderId').value.trim() ? `<p><span style="color:#6b7a72">Order ID</span><br><b>${esc($('orderId').value.trim())}</b></p>` : ''}
          <p><span style="color:#6b7a72">Date</span><br>${fmtDate(invDate)}</p>
        </div>
      </div>
      <table class="it">
        <thead><tr><th style="width:36px">#</th><th>Item</th><th class="r" style="width:56px">Qty</th><th class="r" style="width:100px">Price</th><th class="r" style="width:110px">Amount</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="sum"><table>
        <tr><td>Subtotal</td><td>${inr(t.sub)}</td></tr>
        ${t.disc > 0 ? `<tr class="dc"><td>Discount (${t.pct}%)</td><td>- ${inr(t.disc)}</td></tr>` : ''}
        <tr><td>Delivery charge</td><td>${inr(t.del)}</td></tr>
        <tr class="gt"><td>Total</td><td>${inr(t.grand)}</td></tr>
        ${t.disc > 0 ? `<tr class="sv"><td colspan="2">You saved ${inr(t.disc)} (${t.pct}% off)</td></tr>` : ''}
      </table></div>
    </div>
    <div class="foot">
      <div class="qr"><div class="q">${qrSrc ? `<img src="${qrSrc}" alt="QR">` : `<span style="font-size:11px;color:#a89f86;line-height:1.5;padding:8px">QR code<br>image here</span>`}</div><b>Scan &amp; Pay</b></div>
      <div class="contact">
        <div class="thx">Thank you for supporting handmade!</div>
        <div class="ph"><span><i class="fa-solid fa-phone"></i>${PHONE}</span><span><i class="fa-brands fa-whatsapp"></i>${WA}</span></div>
        <div><i class="fa-brands fa-instagram"></i>${INSTA}</div>
        <div><i class="fa-solid fa-envelope"></i>${MAIL}</div>
        <div><i class="fa-solid fa-globe"></i>${SITE}</div>
        <div class="small">Online payment only · Delivery charge is paid before dispatch · Handmade items may vary slightly in shade.</div>
      </div>
    </div>
  </div>`;
}
function renderDoc() {
  const t = totals();
  $('tSub').textContent = inr(t.sub); $('tDel').textContent = inr(t.del);
  $('tDiscRow').style.display = t.disc > 0 ? '' : 'none'; $('tDiscPct').textContent = t.pct; $('tDisc').textContent = '-' + inr(t.disc); $('tGrand').textContent = inr(t.grand);
  $('tCost').textContent = Math.round(t.cost).toLocaleString('en-IN'); $('tProfit').textContent = Math.round(t.profit).toLocaleString('en-IN');
  $('sheetHost').innerHTML = docHTML(); fit();
}
function fit() {
  const w = $('pvWrap').clientWidth, host = $('sheetHost'), s = Math.min(1, w / 794);
  host.style.transform = `scale(${s})`; $('pvWrap').style.height = (host.offsetHeight * s) + 'px';
}
window.addEventListener('resize', fit);
['cName', 'cPhone', 'cEmail', 'cAddr', 'delivery', 'discount', 'orderId', 'serial'].forEach(id => $(id).addEventListener('input', renderDoc));

/* ================= SAVE TO SHEET ================= */
let savedNo = '';   // invoice no already saved in this session (re-save = update, not new row)
async function saveInvoice() {
  if (!API_URL) return { ok: false, error: 'API_URL is not set in the HTML file' };
  const payload = {
    invoiceNo: invNo(), dateText: fmtDate(invDate), iso: invDate.toISOString(),
    name: $('cName').value.trim(), phone: $('cPhone').value.trim(), email: $('cEmail').value.trim(), address: $('cAddr').value.trim(),
    delivery: Math.max(0, num($('delivery').value)),
    orderId: $('orderId').value.trim(), discountPct: totals().pct, update: savedNo === invNo(),
    items: validItems().map(i => ({ pid: i.pid, name: i.pid ? i.name : i.text, desc: i.desc, qty: i.qty, rate: i.rate, cost: i.cost }))
  };
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    return await res.json();
  } catch (e) { return { ok: false, error: e.message }; }
}
function validate() {
  if (!$('cName').value.trim()) { alert('Customer name is required'); $('cName').focus(); return false; }
  if (!$('cPhone').value.trim()) { alert('Phone number is required'); $('cPhone').focus(); return false; }
  if (!validItems().length) { alert('Add at least one item'); return false; }
  return true;
}
async function saveFlow(stampNow) {
  if (stampNow) { invDate = new Date(); renderDoc(); }
  say('Saving to sheet…');
  const r = await saveInvoice();
  if (r.ok) {
    const m = String(r.invoiceNo || '').match(/(\d+)$/);
    if (r.renumbered && m) { $('serial').value = parseInt(m[1], 10); renderDoc(); toast('Invoice no changed to ' + r.invoiceNo + ' (old one was already used)'); }
    savedNo = invNo(); markUsed(); loadCustomers();
    say(`Saved ${r.invoiceNo} to Google Sheet ✔`, 'ok'); return true;
  }
  say('Sheet save failed: ' + (r.error || 'unknown error'), 'err');
  return confirm('Invoice could not be saved to the sheet (' + (r.error || 'error') + ').\nContinue anyway?');
}
$('btnSave').onclick = async () => { if (!validate()) return; const b = $('btnSave'); b.disabled = true; await saveFlow(true); b.disabled = false; };

/* ================= PRINT / PDF ================= */
$('btnPrint').onclick = async () => {
  if (!validate()) return;
  if (!(await saveFlow(true))) return;
  markUsed(); setTimeout(() => window.print(), 150);
};
$('btnPdf').onclick = async () => {
  if (!validate()) return;
  if (!(await saveFlow(true))) return;
  say('Creating PDF…');
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:#fff';
  holder.innerHTML = docHTML(); document.body.appendChild(holder);
  const sh = holder.firstElementChild;
  sh.style.minHeight = '1118px';                 // a hair under A4 (1123px) so no blank 2nd page
  sh.style.wordSpacing = '1.5px';                // keeps spaces between words in the PDF
  sh.style.textRendering = 'geometricPrecision';
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const name = invNo() + '_' + ($('cName').value.trim().replace(/[^\w]+/g, '_') || 'customer') + '.pdf';
    await html2pdf().set({
      margin: 0, filename: name, image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css'], avoid: ['tr', '.foot'] }
    }).from(holder.firstElementChild).save();
    markUsed(); say('PDF saved: ' + name, 'ok');
  } catch (e) { say('PDF failed: ' + e.message, 'err'); }
  finally { holder.remove(); }
};
$('btnSync').onclick = () => { syncProducts(); refreshSerial(); loadCustomers(); };
$('btnNew').onclick = () => {
  if (!confirm('Start a new invoice? Current details will be cleared.')) return;
  ['cName', 'cPhone', 'cEmail', 'cAddr', 'delivery', 'discount', 'orderId'].forEach(id => $(id).value = '');
  items = [blank()]; invDate = new Date(); savedNo = ''; renderRows(); refreshSerial(); loadCustomers();
};

/* ================= INIT ================= */
try { products = JSON.parse(lsGet('rkc_products', '[]')); } catch (e) { products = []; }
buildLists(); renderRows(); renderDoc(); refreshSerial(); syncProducts(); loadCustomers();
if (!API_URL) say('API_URL is empty – invoices will NOT be saved to the sheet until you paste the Apps Script URL in the file.', 'err');
</script>
